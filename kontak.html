  <link rel="stylesheet" href="style.css">

</head>

        </ul>
      </div>
    </div>
  </nav>

  <!-- Bagian Kontak -->
  <section id="contact" class="container py-5 mt-5">
    <h2 class="text-center mb-4 text-primary fw-semibold">Kontak Kami</h2>

    <div class="row justify-content-center">
      <!-- Informasi Kontak di Kiri -->
      <div class="col-md-4 mb-4">
        <ul class="list-unstyled contact-info">
          <li class="mb-4 d-flex align-items-center">
            <i class="fa-solid fa-location-dot fa-2x me-3 text-info"></i>
            <div>
              <p class="mb-0 fw-semibold">Anuarman Hura</p>
              <p class="mb-0 text-muted">Gunungsitoli 22810</p>
            </div>
          </li>
          <li class="mb-4 d-flex align-items-center">
            <i class="fa-solid fa-envelope fa-2x me-3 text-info"></i>
            <a href="anuarmanhura@gmail.com" class="text-decoration-none text-dark">
              anuarmanhura@gmail.com
            </a>
          </li>
          <li class="d-flex align-items-center">
            <i class="fa-solid fa-phone fa-2x me-3 text-info"></i>
            <p class="mb-0">+62 813 7216 7013</p>
          </li>
        </ul>
      </div>

      <!-- Formulir Kontak di Kanan -->
      <div class="col-md-6">
        <form id="contact-form" class="p-4 shadow-sm bg-white rounded-4">
          <div class="row mb-3">
            <div class="col">
              <label for="name" class="form-label">Nama</label>
              <input type="text" id="name" class="form-control" placeholder="Nama">
            </div>
            <div class="col">
              <label for="email" class="form-label">E-mail</label>
              <input type="email" id="email" class="form-control" placeholder="E-mail">
            </div>
          </div>

          <div class="row mb-3">
            <div class="col">
              <label for="whatsapp" class="form-label">No. WhatsApp</label>
              <input type="text" id="whatsapp" class="form-control" placeholder="No. WhatsApp">
            </div>
            <div class="col">
              <label for="package" class="form-label">Pilih Paket Website</label>
              <select id="package" class="form-select">
                <option>-- Pilih Paket --</option>
                <option>Service Komputer</option>
                <option>Desain Websites</option>
                <option>Konsultasi Jasa</option>
              </select>
            </div>
          </div>

          <div class="mb-3">
            <label for="note" class="form-label">Catatan Tambahan</label>
            <textarea id="note" class="form-control" rows="4" placeholder="Tuliskan pesan tambahan di sini..."></textarea>
          </div>

          <div class="text-center">
            <button type="submit" class="btn btn-info text-white rounded-pill px-4 py-2 fw-semibold">
              <i class="fa-brands fa-whatsapp me-2"></i>Kirim Via WhatsApp
            </button>
          </div>
        </form>
      </div>
    </div>
  </section>

  <!-- Script Bootstrap -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
